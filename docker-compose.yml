services:
  sql:
    image: mcr.microsoft.com/mssql/server:2025-latest
    environment:
    # ACCEPT_EULA=Y is an environment variable you pass to a Docker container to confirm that you’ve read and agree to the software vendor’s End User License Agreement (EULA)
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=Alborad@0862
    platform: "linux/amd64"
    ports:
      - "1433:1433"
    volumes:
      - sql_data:/var/opt/mssql

  redis:
    image: redis:latest
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  sql_data:
  redis_data: